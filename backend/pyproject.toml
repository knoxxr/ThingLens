[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinglens"
version = "0.1.0"
description = "ThingsBoard 디바이스·에셋 상관관계 분석 (백엔드)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
thinglens = "thinglens.cli:main"

[tool.setuptools.packages.find]
include = ["thinglens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 실제 테스트 ThingsBoard가 필요 (THINGLENS_IT_TB_URL)"]
